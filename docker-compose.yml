services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testproof
      POSTGRES_PASSWORD: testproof
      POSTGRES_DB: testproof
    ports:
      - '5432:5432'
    volumes:
      - testproof-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testproof']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/kristijorgji/testproof:0.4.7
    # Runs the published image. To build from a local checkout instead,
    # comment out `image:` above and uncomment the two lines below.
    # build:
    #   context: .
    ports:
      - '${TESTPROOF_PORT:-3100}:3100'
    environment:
      DATABASE_URL: postgres://testproof:testproof@postgres:5432/testproof
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me-please-replace}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
      TESTPROOF_DEFAULT_STORAGE: ${TESTPROOF_DEFAULT_STORAGE:-}
      TESTPROOF_DEFAULT_LEDGER_FILE: ${TESTPROOF_DEFAULT_LEDGER_FILE:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  testproof-pg:
