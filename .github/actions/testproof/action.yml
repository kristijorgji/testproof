name: Testproof
description: Validate a flow ledger and push coverage to a Testproof server
inputs:
  url:
    description: Testproof server URL
    required: false
  token:
    description: Project API token
    required: false
  project:
    description: Project id
    required: false
  config:
    description: Path to testproof.config.ts
    required: false
    default: testproof.config.ts
runs:
  using: composite
  steps:
    - name: Resolve CLI
      id: cli
      shell: bash
      run: |
        if [ -x node_modules/.bin/testproof ]; then
          echo "bin=node_modules/.bin/testproof" >> "$GITHUB_OUTPUT"
        else
          echo "bin=npx --yes testproof@latest" >> "$GITHUB_OUTPUT"
        fi
    - name: Validate
      shell: bash
      run: ${{ steps.cli.outputs.bin }} validate --config "${{ inputs.config }}"
    - name: Push coverage
      shell: bash
      env:
        TESTPROOF_URL: ${{ inputs.url }}
        TESTPROOF_TOKEN: ${{ inputs.token }}
        TESTPROOF_PROJECT: ${{ inputs.project }}
      run: ${{ steps.cli.outputs.bin }} push --config "${{ inputs.config }}"
