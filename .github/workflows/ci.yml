name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build

  ledger:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @testproof/web storybook:build
      - name: Validate demo ledger
        run: node packages/cli/dist/index.js validate
      - name: Check generated coverage docs
        run: node packages/cli/dist/index.js generate --check

  ci-ok:
    if: always()
    needs: [quality, ledger]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and ledger
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "ledger=${{ needs.ledger.result }}"
          if [ "${{ needs.quality.result }}" != success ] || [ "${{ needs.ledger.result }}" != success ]; then
            exit 1
          fi
