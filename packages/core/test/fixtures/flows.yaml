version: 2
platforms:
  - id: web
    title: Web
  - id: mobile
    title: Mobile
    children:
      - id: mobile.ios
        title: iOS
      - id: mobile.android
        title: Android
areas:
  - id: AUTH
    title: AUTH
    groups:
      - title: Login
        notes: |
          Sign-in is shared across web and native. Keep titles stable — they are
          used as the human-readable row in generated coverage.
        flows:
          - id: FLOW-AUTH-LOGIN-SUCCESS
            title: Correct credentials open the dashboard
            targets: [web, mobile]
          - id: FLOW-AUTH-LOGIN-INVALID
            title: Invalid credentials
            targets: [web]
            note: Shown as a field error, not a toast.
